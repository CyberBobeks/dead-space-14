  name: reinforced wall
  components:
  - type: Sprite
# DS14-start
    drawdepth: Mobs
    sprite: _DeadSpace/Structures/Walls/metal_reinforced.rsi
    offset: "0, 0"
# DS14-end
  - type: Icon
# DS14-start
    sprite: _DeadSpace/Structures/Walls/metal_reinforced.rsi
    state: full
# DS14-end
  - type: Construction
    graph: Girder
    node: reinforcedWall
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
# DS14-start
    key: walls-metal-reinforced
    base: wall
# DS14-end
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
# DS14-start
          0: { sprite: Structures/Walls/solid.rsi, state: reinf_construct-0, visible: true}
          1: { sprite: Structures/Walls/solid.rsi, state: reinf_construct-1, visible: true}
          2: { sprite: Structures/Walls/solid.rsi, state: reinf_construct-2, visible: true}
          3: { sprite: Structures/Walls/solid.rsi, state: reinf_construct-3, visible: true}
          4: { sprite: Structures/Walls/solid.rsi, state: reinf_construct-4, visible: true}
          5: { sprite: Structures/Walls/solid.rsi, state: reinf_construct-5, visible: true}
# DS14-end
  - type: ReinforcedWallReplacementMarker
  - type: StaticPrice
    price: 250
  - type: RadiationBlocker
    resistance: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000

