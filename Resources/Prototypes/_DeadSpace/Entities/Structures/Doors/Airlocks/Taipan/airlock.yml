# Assembly
- type: entity
  id: AirlockTaipanAssembly
  parent: AirlockAssembly
  name: каркас шлюза
  description: Он открывается, он закрывается, и он может вас раздавить.
  suffix: Тайпан
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Doors/Airlocks/Standard/taipan_basic.rsi
    state: assembly
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: AirlockTaipan
    node: assembly

- type: entity
  parent: AirlockTaipanAssembly
  id: AirlockTaipanGlassAssembly
  name: каркас шлюза
  description: Он открывается, он закрывается, и он может вас раздавить.
  suffix: Тайпан, Стеклянный
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Doors/Airlocks/Glass/taipan_glass.rsi
    state: assembly

# Airlock
- type: entity
  id: AirlockTaipan
  parent: Airlock
  name: шлюз
  description: Он открывается, он закрывается, и он может вас раздавить.
  suffix: Тайпан
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsTaipan ]
  - type: Paintable
    group: TaipanAirlockStandard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 700
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: Construction
    graph: AirlockTaipan
    node: airlock
    containers:
    - board
  - type: StaticPrice
    price: 235

- type: entity
  id: AirlockTaipanGlass
  parent: AirlockGlass
  name: стеклянный шлюз
  description: Он открывается, он закрывается, и он может вас раздавить.
  suffix: Тайпан
  components:
  - type: Paintable
    group: TaipanAirlockGlass
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsTaipan ]
  - type: Construction
    graph: AirlockTaipan
    node: glassAirlock
  - type: StaticPrice
    price: 235

- type: entity
  id: HighSecDoorTaipan
  parent: HighSecDoor
  name: бронированная дверь
  description: Удерживает плохих снаружи, а хороших внутри.
  suffix: Тайпан
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsTaipan ]

- type: entity
  parent: AirlockHatch
  id: AirlockHatchTaipan
  name: герметичный люк
  description: Он открывается, он закрывается, он может раздавить вас, а за ним лишь космос.
  suffix: Тайпан, Внешний
  components:
  - type: Door
    crushDamage:
      types:
        Blunt: 15
    openSound:
      path: /Audio/Machines/airlock_ext_open.ogg
    closeSound:
      path: /Audio/Machines/airlock_ext_close.ogg
    denySound:
      path: /Audio/Machines/airlock_deny.ogg
  - type: Wires
    layoutId: AirlockExternal

- type: entity
  parent: AirlockHatchTaipan
  id: AirlockHatchGlassTaipan
  suffix: Тайпан, Внешний
  components:
  - type: Door
    occludes: false
  - type: Occluder
    enabled: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer

