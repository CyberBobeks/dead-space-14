- type: entity
  id: ActionRenegadeLightning
  name: Ударить молнией
  description: Выпускает в цель молнию.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 60
    icon: _DeadSpace/Renegade/actions/renegade_lightning.png
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:RenegadeLightningEvent

- type: entity
  id: ActionRenegadeArmorPiercingStrike
  name: Бронебойный удар
  description: Следующий успешный удар активным мечом ренегата нанесёт точный бронебойный урон.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _DeadSpace/Interface/Actions/slash.png
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:RenegadeArmorPiercingStrikeEvent

- type: entity
  id: ActionRenegadeDisarmStrike
  name: Обезоруживающий удар
  description: Следующий успешный удар активным мечом ренегата выбьет предмет из активной руки цели.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: Interface/Actions/disarm.png
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:RenegadeDisarmStrikeEvent

- type: entity
  id: ActionRenegadeKnockdownStrike
  name: Низвергающий удар
  description: Следующий успешный удар активным мечом ренегата принудительно уложит цель на землю.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _DeadSpace/Actions/cqc_actions.rsi
      state: trip_punch
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:RenegadeKnockdownStrikeEvent

- type: entity
  id: ActionRenegadeFocusedRage
  name: Направленный гнев
  description: На 40 секунд ускоряет ренегата и помогает игнорировать боль, путы и оглушение.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 100
    icon: _DeadSpace/Demons/ability_icons/herald_enrage.png
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:RenegadeFocusedRageEvent

- type: entity
  id: ActionRenegadeForceChoke
  name: Удушение Силой
  description: Поднимает одну цель в воздух, лишая её возможности двигаться и мешая вести точный огонь.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 15
    icon: _DeadSpace/Demons/ability_icons/shadow_grapple.png
    itemIconStyle: NoItem
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:RenegadeForceChokeEvent

- type: entity
  id: ActionRenegadeSubmission
  name: Подчинение силой
  description: Влияет на разум цели с помощью силы, подчиняя его.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    icon: _DeadSpace/Renegade/actions/submission.png
  - type: TargetAction
    range: 8
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:RenegadeSubmissionEvent

- type: entity
  id: ActionRecallRenegadeEsword
  name: Телепортировать меч
  description: Телепортирует ваш энерго меч вам в руки.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Objects/Weapons/Melee/energykatana.rsi
      state: icon
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:RecallRenegadeEswordEvent {}

- type: entity
  id: ActionRenegadeEswordTeleport
  name: Телепортироваться к мечу
  description: Телепортирует вас к энерго мечу и даёт вам его в руку.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Objects/Weapons/Melee/energykatana.rsi
      state: icon
    itemIconStyle: noItem
  - type: InstantAction
    event: !type:RenegadeEswordTeleport {}
